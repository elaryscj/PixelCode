spring.application.name=game-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

game.token-secret=${TOKEN_SECRET:dev-only-secret-change-me-before-deploying}
game.admin-usernames=${ADMIN_USERNAMES:}
game.cors-origins=${CORS_ORIGINS:*}
game.door-seconds=240
game.max-match-minutes=20
game.absence-seconds=300
game.join-window-seconds=300
game.ban-minutes=${BAN_MINUTES:30}
game.eval-timeout-ms=3000
# brute-force / spam limits (per backend instance, in memory)
game.limits.register-per-hour=10
game.limits.login-per-account=10
game.limits.login-per-ip=40
game.limits.reset-mails-per-hour=3

# --- E-mail (password reset / welcome). Without MAIL_HOST the link is only printed to the backend console. ---
game.frontend-url=${FRONTEND_URL:http://localhost:5173}
game.mail-from=${MAIL_FROM:no-reply@pixelcode.arena}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
