# Render Blueprint: New + > Blueprint > pick this repo. Replace the two URLs after the first deploy (see DEPLOY.md).
databases:
  - name: pixelcode-db
    plan: free
    databaseName: game_db

services:
  - type: web
    name: pixelcode-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/deep
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase: { name: pixelcode-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pixelcode-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: pixelcode-db, property: database }
      - key: DB_USER
        fromDatabase: { name: pixelcode-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pixelcode-db, property: password }
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SERVER_REGION
        value: oregon
      - key: FRONTEND_URL
        value: https://pixelcode-arena.onrender.com
      - key: ADMIN_USERNAMES
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # The site is plain files (SPA mode): a free Static Site never sleeps and uses no instance hours.
  - type: web
    name: pixelcode-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pixelcode-backend-unf5.onrender.com
      - key: VITE_WS_URL
        value: wss://pixelcode-backend-unf5.onrender.com/ws
